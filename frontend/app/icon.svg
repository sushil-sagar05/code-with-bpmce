<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f1f1f" stroke-width="8" />

  <!-- Subtle Outer Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#orangeGrad)" stroke-width="4" opacity="0.35" />

  <!-- Code Bracket Left '<' -->
  <path d="M150 170 L70 256 L150 342" fill="none" stroke="url(#orangeGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Slash '/' -->
  <path d="M290 140 L220 372" fill="none" stroke="url(#orangeGrad)" stroke-width="38" stroke-linecap="round" filter="url(#glow)" />

  <!-- Code Bracket Right '>' -->
  <path d="M362 170 L442 256 L362 342" fill="none" stroke="url(#orangeGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
